[build-system]
requires = ["setuptools>=77.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dbus-pump"
version = "0.1.7"
description = "Home-Assistant-backed water tank/pump/valve bridge for Victron Venus OS"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12,<3.13"
dependencies = [
    "requests>=2.31",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov",
    "pyyaml==6.0.3",
    "ruff>=0.9",
]

[tool.setuptools]
packages = ["dbus_pump"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "BLE", "ASYNC", "RUF"]

[tool.pylint.messages_control]
disable = [
    "E0401",  # Unable to import (Venus OS libs absent off-device)
    "C0103", "C0116", "C0301", "C0413",
    "R0902", "R0903", "R0913", "R0914", "R0915",
    "W0718", "W1203", "W0613",
]

[tool.pytest.ini_options]
filterwarnings = ["error"]
testpaths = ["tests"]
addopts = "--cov --cov-report=term-missing --cov-fail-under=80"

# Install wheel-only build tools before building the local package without build isolation.
[dependency-groups]
build = ["build==1.6.1", "setuptools==84.0.0", "wheel==0.48.0"]
