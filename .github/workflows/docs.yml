name: Documentation checks

on:
  workflow_call:

permissions:
  contents: read

jobs:
  documentation:
    name: Documentation links and artifacts
    runs-on: ${{ fromJSON((vars.CI_RUNNER_MODE == 'self-hosted' || vars.CI_RUNNER_MODE == 'k3s') && ((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) || (contains(fromJSON('["push","schedule","workflow_dispatch"]'), github.event_name) && github.ref == format('refs/heads/{0}', github.event.repository.default_branch))) && (vars.CI_RUNNER_LABELS || '[]') || '["ubuntu-latest"]') }}
    timeout-minutes: 5
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12.13'
          cache: pip
          cache-dependency-path: .github/requirements-docs.txt
      - name: Install locked documentation test dependencies
        run: 'python -m pip install --require-hashes --only-binary=:all: -r .github/requirements-docs.txt'
      - name: Validate links, diagrams and wiki exports
        # The full CI job still measures application coverage; this job runs the
        # same documentation tests independently for documentation-only changes.
        run: python -m pytest -o addopts='' tests/test_docs.py
