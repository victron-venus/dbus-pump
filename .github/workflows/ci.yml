name: CI

on:
  workflow_call:

permissions:
  contents: read

jobs:
  ci:
    name: CI
    # Reusable workflows must be called at the JOB level (no runs-on/steps);
    # a step-level `uses` of a workflow_call workflow is rejected by GitHub.
    uses: victron-venus/venus-os-ci-toolkit/.github/workflows/python-ci.yml@5f5ff3846aacee0edfbeadeb316ee68525e9208d # main
    with:
      python-version: '3.12.13'
      # mypy has pre-existing errors (Venus OS imports without stubs); tracked separately
      run-type-check: false
      coverage-threshold: 60

  locked-tests:
    name: Locked dependency tests
    runs-on: ${{ fromJSON((vars.CI_RUNNER_MODE == 'self-hosted' || vars.CI_RUNNER_MODE == 'k3s') && ((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) || (contains(fromJSON('["push","schedule","workflow_dispatch"]'), github.event_name) && github.ref == format('refs/heads/{0}', github.event.repository.default_branch))) && (vars.CI_RUNNER_LABELS || '[]') || '["ubuntu-latest"]') }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12.13'
      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      # Install dependency wheels only; test the checked-out source without build hooks.
      # The existing reusable job separately validates editable project installation.
      - name: Install locked development dependencies
        run: uv sync --locked --extra dev --no-build --no-install-project
      - name: Test with existing coverage threshold
        run: .venv/bin/python -m pytest tests/ --cov=dbus_pump --cov-report=xml --cov-fail-under=60

  validate-secrets-template:
    name: Validate secrets template
    runs-on: ${{ fromJSON((vars.CI_RUNNER_MODE == 'self-hosted' || vars.CI_RUNNER_MODE == 'k3s') && ((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) || (contains(fromJSON('["push","schedule","workflow_dispatch"]'), github.event_name) && github.ref == format('refs/heads/{0}', github.event.repository.default_branch))) && (vars.CI_RUNNER_LABELS || '[]') || '["ubuntu-latest"]') }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@351661ca32ac09a36dc5ee2d536e3128f2a3c8ed # v2.22.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate local_config.example.py syntax
        run: python -m py_compile local_config.example.py
      - name: Check local_config.example.py has no real values
        run: |
          if grep -E '(token|password|secret|key)\s*=\s*["\x27][^"\x27]{8,}' local_config.example.py | grep -v 'your_'; then
            echo "ERROR: local_config.example.py may contain real values"
            exit 1
          fi
          echo "OK: local_config.example.py looks like a template"
    timeout-minutes: 30
